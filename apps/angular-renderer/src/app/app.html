<div class="h-screen w-screen bg-gray-900 text-gray-300 vscode-ui-font flex">
  <!-- VS Code Activity Bar -->
  <div class="vscode-activity-bar">
    <app-activity-bar-icon [active]="true" label="Service Order" title="Service Order">
      <svg icon xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
      </svg>
    </app-activity-bar-icon>
    <!-- Only keeping the Service Order and the screen projection buttons now -->
    <div style="margin-top: auto; padding: 8px 0;">
      <app-screen-buttons variant="activity"></app-screen-buttons>
    </div>
  </div>

  <!-- Main Layout: Service Order Sidebar + Slide Editor -->
  <div class="flex-1 flex">
    <!-- Service Order Sidebar -->
    <div class="vscode-sidebar bg-gray-800 border-r border-gray-700" [style.width]="sidebarWidth + 'px'">
      <app-service-order-manager></app-service-order-manager>
    </div>

    <!-- VS Code Resize Handle for Sidebar -->
    <div class="vscode-resize-handle-vertical" (mousedown)="startSidebarResize($event)" (dblclick)="resetSidebar()"
      title="Double-click to reset sidebar width"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex bg-gray-900">
      <!-- Slide Editor or Lyrics Column -->
      <div class="flex-1 overflow-hidden flex">
        <div class="flex-1 overflow-auto bg-gray-900">
          <app-slide-manager></app-slide-manager>
        </div>
        <div class="w-80 border-l border-gray-700 bg-gray-800">
          <app-lyrics-column></app-lyrics-column>
        </div>
      </div>

      <!-- VS Code Resize Handle for Mixer -->
      <div class="vscode-resize-handle-vertical" (mousedown)="startMixerResize($event)" (dblclick)="resetMixer()"
        title="Double-click to reset mixer width"></div>

      <!-- Mixer Sidebar -->
      <div [style.width]="mixerWidth + 'px'" style="min-width: 200px; max-width: 600px;">
        <app-mixer-sidebar></app-mixer-sidebar>
      </div>
    </div>
  </div>
</div>
