<app-modal [isOpen]="isOpen" [title]="title" (onClose)="onClose.emit()" [closeOnOverlayClick]="false">
    <div class="space-y-4 p-6">
        <!-- Timer Name -->
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Timer Name</label>
            <app-vscode-input [(ngModel)]="name" placeholder="e.g., Sermon Timer" [disabled]="isSaving">
            </app-vscode-input>
        </div>

        <!-- Duration -->
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Duration</label>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <input type="text" [(ngModel)]="hours"
                        class="w-16 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-center text-sm"
                        maxlength="2" [disabled]="isSaving">
                    <span class="text-xs text-gray-500">hours</span>
                </div>
                <span class="text-gray-600">:</span>
                <div class="flex items-center gap-2">
                    <input type="text" [(ngModel)]="minutes"
                        class="w-16 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-center text-sm"
                        maxlength="2" [disabled]="isSaving">
                    <span class="text-xs text-gray-500">minutes</span>
                </div>
            </div>
        </div>

        <!-- Display Selection -->
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Target Displays</label>
            @if (displays.length === 0) {
            <p class="text-xs text-gray-600 italic">No external displays detected</p>
            } @else {
            <div class="space-y-2 bg-gray-900/30 p-3 rounded border border-gray-700/50">
                @for (display of displays; track display.id) {
                <label class="flex items-center gap-3 cursor-pointer group">
                    <input type="checkbox" [checked]="selectedDisplays.includes(display.id)"
                        (change)="handleDisplayToggle(display.id)"
                        class="form-checkbox bg-gray-900 border-gray-700 rounded text-blue-500" [disabled]="isSaving">
                    <span class="text-sm text-gray-300 group-hover:text-white transition-colors">
                        {{ display.name }} {{ display.isPrimary ? '(Main)' : '' }}
                    </span>
                </label>
                }
            </div>
            }
        </div>

        <!-- Error -->
        @if (error) {
        <div class="bg-red-500/10 border border-red-500/50 rounded p-4">
            <p class="text-xs text-red-400 font-medium">{{ error }}</p>
        </div>
        }

        <!-- Footer -->
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-700">
            <app-vscode-button variant="secondary" (onClick)="onClose.emit()"
                [disabled]="isSaving">Cancel</app-vscode-button>
            <app-vscode-button (onClick)="handleSave()" [disabled]="isSaving">
                {{ isSaving ? 'Saving...' : (timer ? 'Update Timer' : 'Create Timer') }}
            </app-vscode-button>
        </div>
    </div>
</app-modal>
