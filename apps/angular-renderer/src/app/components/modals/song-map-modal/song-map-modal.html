<app-vscode-modal size="full" (onClose)="close()" [hasHeaderSlot]="true">
    <!-- Modal Header Slot -->
    <div header class="flex items-center justify-between w-full pr-4">
        <div>
            <h2 class="text-xs font-bold uppercase tracking-wider">Edit Song Map: <span class="text-[#007acc]">{{
                    data.songName }}</span></h2>
            <p class="text-[9px] text-gray-500 font-medium">Capture chords and lyrics in a simplified text format.</p>
        </div>
        <div class="flex items-center gap-2 px-3 py-1 bg-[#252526] rounded-full border border-[#333]">
            <ng-icon name="heroInformationCircle" class="text-[#007acc] text-[10px]"></ng-icon>
            <span class="text-[8px] uppercase font-bold text-gray-400 tracking-widest">Simplified Format</span>
        </div>
    </div>

    <!-- ModalContent: Body -->
    <div class="flex h-full w-full overflow-hidden bg-[#1e1e1e] p-2 gap-2">
        <!-- Editor Area -->
        <div class="flex-1 flex flex-col bg-[#161616] border border-[#333] rounded overflow-hidden">
            <textarea [(ngModel)]="rawText"
                class="flex-1 w-full bg-[#161616] text-[#d4d4d4] p-4 font-mono text-sm leading-relaxed outline-none resize-none custom-scrollbar"
                spellcheck="false" placeholder="Edit your song content here..."></textarea>
        </div>
    </div>

    <!-- Footer Slot -->
    <div footer class="flex items-center justify-end w-full gap-3">
        <button (click)="close()"
            class="px-5 py-2 text-[11px] font-bold uppercase tracking-wider hover:bg-[#333] rounded transition-colors text-gray-400">Cancel</button>
        <button (click)="save()"
            class="px-10 py-2 bg-[#007acc] hover:bg-[#0062a3] text-white rounded text-[11px] font-bold transition-all shadow-lg shadow-blue-900/20 uppercase tracking-widest flex items-center gap-2">
            <ng-icon name="heroCheck"></ng-icon>
            Apply Changes
        </button>
    </div>
</app-vscode-modal>
