<div
    class="preservice-container w-screen h-screen bg-[#1e1e1e] text-[#cccccc] flex flex-col font-sans border border-[#3c3c3c]">
    <!-- Header -->
    <div
        class="header h-12 flex items-center justify-between px-4 bg-[#252526] border-b border-[#3c3c3c] flex-shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-sm font-semibold uppercase tracking-wider text-blue-400">Pre-Service Music</span>
        </div>
        <button (click)="closeWindow()" class="hover:bg-red-600 p-1.5 rounded transition-colors group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5 group-hover:text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- Content -->
    <div class="p-8 flex-1 flex flex-col gap-6">
        <div class="info-section">
            <h1 class="text-2xl font-bold text-white mb-2">YouTube Playlist</h1>
            <p class="text-zinc-400">Settings for the pre-service background music. This playlist will be opened for
                management.</p>
        </div>

        <div class="input-section flex flex-col gap-2">
            <label class="text-xs font-bold uppercase text-zinc-500">Playlist URL</label>
            <div class="flex gap-2">
                <input type="text" [(ngModel)]="playlistUrl" placeholder="https://www.youtube.com/playlist?list=..."
                    class="flex-1 bg-[#3c3c3c] border border-[#3c3c3c] focus:border-blue-500 rounded px-3 py-2 text-white outline-none transition-all" />
                <button (click)="saveUrl()" [disabled]="isSaving()"
                    class="bg-blue-600 hover:bg-blue-500 disabled:bg-zinc-700 text-white px-6 py-2 rounded font-medium transition-colors">
                    {{ isSaving() ? 'Saving...' : 'Save' }}
                </button>
            </div>
        </div>

        <div class="actions flex gap-4 mt-4">
            <button (click)="openInBrowser()"
                class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-3 rounded-lg border border-zinc-700 transition-all font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                </svg>
                Open in Browser
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer p-4 bg-zinc-800/30 border-t border-zinc-700/50 mt-auto">
        <div class="flex items-start gap-3">
            <div class="bg-blue-500/10 p-2 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-5 h-5 text-blue-400">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                </svg>
            </div>
            <p class="text-xs text-zinc-500 leading-relaxed">
                The playlist URL is synchronized across all instances. Make sure the playlist is public or unlisted for
                best results.
            </p>
        </div>
    </div>
</div>
