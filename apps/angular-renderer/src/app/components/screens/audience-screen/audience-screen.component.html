<div id="audience-container" class="w-screen h-screen overflow-hidden relative">
    @if (backgroundVideo) {
    <video #backgroundVideoRef class="background-video fixed top-0 left-0 w-full h-full object-cover z-0 opacity-60"
        [src]="backgroundVideo" autoplay [loop]="isLooping" muted></video>
    }

    <!-- Content Layer -->
    <div id="lyric-display"
        class="content-layer relative z-20 flex flex-col w-full h-full p-8 box-border transition-opacity duration-200 overflow-hidden"
        [style.opacity]="opacity" [class.hidden]="!showLyrics && !showVideo" [ngStyle]="lyricStyles()">
        @if (showLyrics && lyricLines.length) {
        @for (line of lyricLines; track $index) {
        <div class="lyric-line leading-[1.2] my-[0.2em]">
            {{ line }}
        </div>
        }
        }

        @if (imagePath) {
        <img [src]="imagePath" [alt]="imageName || ''" class="max-w-[90%] max-h-[90%] object-contain shadow-2xl" />
        }
    </div>

    <!-- Video Player -->
    @if (showVideo) {
    <div id="youtube-player" class="w-full h-full relative z-10"></div>
    }
</div>
