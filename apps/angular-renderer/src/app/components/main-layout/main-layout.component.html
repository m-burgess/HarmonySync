<div class="h-screen w-screen bg-[#060608] text-slate-300 flex flex-col font-sans overflow-hidden">
    <!-- Top Navigation Bar -->
    <div class="h-16 bg-[#0a0a0f]/80 backdrop-blur-xl border-b border-slate-800 flex items-center justify-between px-6 shadow-xl z-20">
        <!-- Logo / Title -->
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <ng-icon name="heroPlay" class="text-white text-lg"></ng-icon>
            </div>
            <div class="flex flex-col">
                <span class="text-sm font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">AURA LIVE</span>
                <span class="text-[10px] font-medium text-slate-500 uppercase tracking-widest">Live Session 11.23.23</span>
            </div>
        </div>

        <!-- Center Screen Toggles -->
        <div class="flex items-center space-x-2 bg-slate-900/50 p-1.5 rounded-xl border border-slate-800/50">
            <button (click)="toggleScreen('audience')" [class]="isScreenActive('audience') ? 'bg-cyan-500/20 text-cyan-400 shadow-inner' : 'text-slate-400 hover:text-slate-200'" class="p-2 rounded-lg transition-all duration-200 group" title="Toggle Audience Screen">
                <ng-icon name="heroComputerDesktop" class="text-lg group-hover:scale-110 transition-transform"></ng-icon>
            </button>
            <button (click)="toggleScreen('confidence')" [class]="isScreenActive('confidence') ? 'bg-cyan-500/20 text-cyan-400 shadow-inner' : 'text-slate-400 hover:text-slate-200'" class="p-2 rounded-lg transition-all duration-200 group" title="Toggle Stage Display">
                <ng-icon name="heroTv" class="text-lg group-hover:scale-110 transition-transform"></ng-icon>
            </button>
            <button (click)="toggleScreen('lowerThirds')" [class]="isScreenActive('lowerThirds') ? 'bg-cyan-500/20 text-cyan-400 shadow-inner' : 'text-slate-400 hover:text-slate-200'" class="p-2 rounded-lg transition-all duration-200 group" title="Toggle Lower Thirds">
                <ng-icon name="heroQueueList" class="text-lg group-hover:scale-110 transition-transform"></ng-icon>
            </button>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
                <span class="text-xs font-bold tracking-widest text-red-400 uppercase">ON AIR</span>
            </div>
            
            <button (click)="displayService.clearAll().subscribe()" class="px-4 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-300 transition-all duration-200 active:scale-95 shadow-lg flex items-center group">
                <ng-icon name="heroBolt" class="text-yellow-500 mr-1.5 group-hover:scale-110 transition-transform"></ng-icon> CLEAR ALL
            </button>

            <button (click)="openPreferences()" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-cyan-400 transition-colors border border-transparent hover:border-slate-700">
                <ng-icon name="heroCog" class="text-xl"></ng-icon>
            </button>
        </div>
    </div>

    <!-- Main Workspace 3-Column Layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Column: Service Flow -->
        <div class="w-80 bg-[#0a0a0f] border-r border-slate-800 flex flex-col z-10 shadow-2xl relative">
            <div class="px-5 py-4 border-b border-slate-800/50 flex justify-between items-center bg-slate-900/20">
                <span class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">Service Flow</span>
                <button class="text-slate-500 hover:text-cyan-400 transition-colors"><ng-icon name="heroPlus" class="text-sm"></ng-icon></button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <app-service-order></app-service-order>
            </div>
        </div>

        <!-- Center Column: Presentation Grid / Lyrics -->
        <div class="flex-1 flex flex-col bg-[#050508] relative overflow-hidden">
            <!-- Subtle background lighting -->
            <div class="absolute inset-0 pointer-events-none overflow-hidden">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] rounded-full bg-cyan-900/5 blur-[150px]"></div>
            </div>

            <div class="px-6 py-4 flex justify-between items-center relative z-10">
                <span class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">Presentation Grid</span>
            </div>

            <div class="flex-1 overflow-auto custom-scrollbar px-6 pb-6 relative z-10">
                @if (currentItemType() === 'song' && currentLyrics()) {
                    <app-lyrics-column [lyrics]="currentLyrics()" [songMap]="currentSongMap()"></app-lyrics-column>
                } @else {
                    <app-slide-grid></app-slide-grid>
                }
            </div>
        </div>

        <!-- Right Column: Audio Stem Mixer -->
        <div class="w-[340px] bg-[#0a0a0f] border-l border-slate-800 flex flex-col z-10 shadow-2xl">
            <div class="px-5 py-4 border-b border-slate-800/50 flex justify-between items-center bg-slate-900/20">
                <span class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">Audio Stem Mixer</span>
                <button class="text-slate-500 hover:text-cyan-400 transition-colors"><ng-icon name="heroAdjustmentsHorizontal" class="text-sm"></ng-icon></button>
            </div>
            <div class="flex-1 overflow-hidden">
                <app-stem-mixer></app-stem-mixer>
            </div>
        </div>

    </div>
</div>
