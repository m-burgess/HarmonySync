<div class="h-screen w-screen bg-gray-900 text-gray-300 flex">
    <!-- VS Code Activity Bar -->
    <div class="vscode-activity-bar">
        <div class="flex flex-col items-center py-4 space-y-4">
            <app-activity-bar-icon id="activity-bar-search" icon="heroMagnifyingGlass"
                [active]="true"></app-activity-bar-icon>
            <app-activity-bar-icon id="activity-bar-files" icon="heroPresentationChartBar"
                [active]="false"></app-activity-bar-icon>
            <app-activity-bar-icon id="activity-bar-audio" icon="heroMusicalNote"
                [active]="false"></app-activity-bar-icon>
            <app-activity-bar-icon id="activity-bar-settings" icon="heroCog" [active]="false"></app-activity-bar-icon>
            <app-activity-bar-icon id="activity-bar-timers" icon="heroClock" [active]="false"></app-activity-bar-icon>
        </div>
        <div class="mt-auto flex flex-col items-center py-4 space-y-4">
            <app-activity-bar-icon id="activity-bar-profile" icon="heroAdjustmentsHorizontal"
                [active]="false"></app-activity-bar-icon>
            <app-activity-bar-icon id="activity-bar-gear" icon="heroCog" [active]="false"></app-activity-bar-icon>
        </div>
    </div>

    <!-- Main Layout: Service Order Sidebar + Slide Editor -->
    <div class="flex-1 flex">
        <!-- Service Order Sidebar -->
        <div class="vscode-sidebar bg-gray-800 border-r border-gray-700" [style.width]="sidebarWidth + 'px'">
            <app-service-order-manager>
            </app-service-order-manager>
        </div>

        <!-- VS Code Resize Handle for Sidebar -->
        <div class="vscode-resize-handle-vertical" (mousedown)="startSidebarResize($event)" (dblclick)="resetSidebar()"
            title="Double-click to reset sidebar width"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col bg-gray-900 overflow-hidden">
            <!-- Top Action Bar -->
            <div class="h-12 border-b border-gray-700 bg-gray-800/50 flex items-center px-4 justify-between">
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-400">Main Presentation</span>
                    <app-screen-buttons (onOpenTimers)="openTimers()"
                        (onToggleScreen)="toggleScreen($event)"></app-screen-buttons>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- Additional controls could go here -->
                </div>
            </div>

            <!-- Slide Editor or Lyrics Column -->
            <div class="flex-1 overflow-hidden flex">
                <div class="flex-1 overflow-auto bg-gray-900 custom-scrollbar">
                    <app-slide-manager [allSlides]="allSlides" [selectedSlide]="selectedSlide"
                        (setAllSlides)="setAllSlides($event)" (setSelectedSlide)="setSelectedSlide($event)">
                    </app-slide-manager>
                </div>
                <div class="w-80 border-l border-gray-700 bg-gray-800/80">
                    <app-lyrics-column [lyrics]="currentLyrics()"></app-lyrics-column>
                </div>
            </div>

            <!-- VS Code Style Status Bar -->
            <div class="h-6 bg-blue-600 text-white flex items-center px-3 text-[11px] justify-between">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Ready
                    </div>
                    <div>Go Engine: <span class="font-bold">v1.0.4</span></div>
                </div>
                <div class="flex items-center space-x-4">
                    <div>UTF-8</div>
                    <div>TypeScript 5.3</div>
                    <div class="flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        0
                    </div>
                </div>
            </div>
        </div>

        <!-- VS Code Resize Handle for Mixer -->
        <div class="vscode-resize-handle-vertical" (mousedown)="startMixerResize($event)" (dblclick)="resetMixer()"
            title="Double-click to reset mixer width"></div>

        <!-- Mixer Sidebar -->
        <div [style.width]="mixerWidth + 'px'" class="bg-gray-800 border-l border-gray-700"
            style="min-width: 200px; max-width: 600px;">
            <app-mixer-sidebar></app-mixer-sidebar>
        </div>
    </div>

    <app-timer-modal [isOpen]="isTimerModalOpen" [displays]="possibleDisplays" (onClose)="isTimerModalOpen = false"
        (onSave)="handleSaveTimer($event)">
    </app-timer-modal>
</div>
