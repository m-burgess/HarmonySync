<div *ngIf="isOpen" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm">
    <div
        class="bg-gray-800 border border-gray-700 rounded-lg shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-700 bg-gray-900/50">
            <h2 class="text-lg font-bold text-white flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 mr-2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                </svg>
                Import Slides
            </h2>
            <button (click)="close()" class="text-gray-400 hover:text-white transition-colors" [disabled]="isImporting">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 space-y-6 overflow-y-auto max-h-[70vh] custom-scrollbar">
            <!-- Import Type Selection -->
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Import Source</label>
                <div class="grid grid-cols-4 gap-3">
                    <button (click)="setImportType('pdf')" [disabled]="isImporting"
                        class="flex flex-col items-center p-4 rounded border-2 transition-all"
                        [ngClass]="importType === 'pdf' ? 'border-blue-500 bg-blue-500/10' : 'border-gray-700 hover:border-gray-600 bg-gray-800/50'">
                        <svg class="w-8 h-8 mb-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        <span class="text-xs font-medium text-gray-300">PDF</span>
                    </button>

                    <button (click)="setImportType('powerpoint')" [disabled]="isImporting"
                        class="flex flex-col items-center p-4 rounded border-2 transition-all"
                        [ngClass]="importType === 'powerpoint' ? 'border-orange-500 bg-orange-500/10' : 'border-gray-700 hover:border-gray-600 bg-gray-800/50'">
                        <svg class="w-8 h-8 mb-2 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span class="text-xs font-medium text-gray-300">PowerPoint</span>
                    </button>

                    <button (click)="setImportType('zip')" [disabled]="isImporting"
                        class="flex flex-col items-center p-4 rounded border-2 transition-all"
                        [ngClass]="importType === 'zip' ? 'border-yellow-500 bg-yellow-500/10' : 'border-gray-700 hover:border-gray-600 bg-gray-800/50'">
                        <svg class="w-8 h-8 mb-2 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                        <span class="text-xs font-medium text-gray-300">Zip Service</span>
                    </button>

                    <button (click)="setImportType('folder')" [disabled]="isImporting"
                        class="flex flex-col items-center p-4 rounded border-2 transition-all"
                        [ngClass]="importType === 'folder' ? 'border-green-500 bg-green-500/10' : 'border-gray-700 hover:border-gray-600 bg-gray-800/50'">
                        <svg class="w-8 h-8 mb-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                        </svg>
                        <span class="text-xs font-medium text-gray-300">Folder</span>
                    </button>
                </div>
            </div>

            <!-- Path Selection -->
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    {{ importType === 'folder' ? 'Selected Folder' : 'Selected File' }}
                </label>
                <div class="flex gap-2">
                    <input type="text" [value]="selectedPath || ''" readonly
                        [placeholder]="'Browse to select ' + (importType === 'folder' ? 'folder' : 'file')"
                        class="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
                    <button (click)="browse()" [disabled]="isImporting"
                        class="vscode-button secondary text-xs">Browse</button>
                </div>
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Resolution
                        (DPI)</label>
                    <select [(ngModel)]="importOptions.dpi"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500"
                        [disabled]="isImporting">
                        <option [ngValue]="96">96 (Draft)</option>
                        <option [ngValue]="150">150 (Default)</option>
                        <option [ngValue]="200">200 (High)</option>
                        <option [ngValue]="300">300 (Ultra)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Format</label>
                    <select [(ngModel)]="importOptions.format"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500"
                        [disabled]="isImporting">
                        <option value="png">PNG (Best)</option>
                        <option value="jpeg">JPG (Faster)</option>
                    </select>
                </div>
            </div>

            <!-- Progress -->
            <div *ngIf="progress" class="bg-gray-900/50 rounded p-4 border border-gray-700 animate-pulse">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-blue-400 font-medium">{{ progress.message }}</span>
                    <span *ngIf="progress.current && progress.total" class="text-[10px] text-gray-500">
                        {{ progress.current }} / {{ progress.total }}
                    </span>
                </div>
                <div *ngIf="progress.current && progress.total"
                    class="w-full bg-gray-800 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-blue-500 h-full transition-all duration-300"
                        [style.width.%]="(progress.current/progress.total) * 100"></div>
                </div>
            </div>

            <!-- Error -->
            <div *ngIf="error" class="bg-red-500/10 border border-red-500/50 rounded p-4">
                <p class="text-xs text-red-400 font-medium">{{ error }}</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 bg-gray-900/50 border-t border-gray-700 flex justify-end gap-3">
            <button (click)="close()" [disabled]="isImporting" class="vscode-button secondary px-6">Cancel</button>
            <button (click)="handleImport()" [disabled]="isImporting || !selectedPath"
                class="vscode-button primary px-6 flex items-center">
                <span *ngIf="!isImporting">Import Slides</span>
                <span *ngIf="isImporting" class="flex items-center">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Importing...
                </span>
            </button>
        </div>
    </div>
</div>
