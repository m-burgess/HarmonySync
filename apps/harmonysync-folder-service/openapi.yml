openapi: 3.0.0
info:
  title: HarmonySync Folder Service API
  description: |
    REST API for the HarmonySync Folder Service - automated service folder monitoring and import.
    
    This service watches a specified folder for zipped service folders, automatically extracts them,
    and organizes service items based on numeric prefixes.
  version: 1.0.0
  contact:
    name: HarmonySync Team
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:3005
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Configuration
    description: Service configuration management
  - name: Services
    description: Extracted service management

paths:
  /health:
    get:
      summary: Health check
      description: Get the health status of the folder service
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: harmonysync-folder-service
                  version:
                    type: string
                    example: 1.0.0
                  watching:
                    type: boolean
                    description: Whether the service is actively watching a folder
                  servicesCount:
                    type: integer
                    description: Number of extracted services available

  /config:
    get:
      summary: Get configuration
      description: Retrieve the current service configuration
      tags:
        - Configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'

    post:
      summary: Update configuration
      description: Update the service configuration
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watchFolder:
                  type: string
                  nullable: true
                  description: Path to folder to watch for zip files
                  example: /home/user/Downloads/services
                extractFolder:
                  type: string
                  description: Path where services will be extracted
                  example: /home/user/.harmonysync/imported-services
                autoDelete:
                  type: boolean
                  description: Whether to delete zip files after extraction
                  example: true
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  config:
                    $ref: '#/components/schemas/ServiceConfig'
        '400':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services:
    get:
      summary: List services
      description: Get a list of all extracted services
      tags:
        - Services
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'

  /services/{id}:
    get:
      summary: Get service details
      description: Get detailed information about a specific service
      tags:
        - Services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service ID
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedService'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete service
      description: Delete an extracted service and its files
      tags:
        - Services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service ID
      responses:
        '200':
          description: Service deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /import/{id}:
    post:
      summary: Import service
      description: Request to import a service into the main application
      tags:
        - Services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service ID to import
      responses:
        '200':
          description: Import request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  service:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ServiceConfig:
      type: object
      properties:
        watchFolder:
          type: string
          nullable: true
          description: Path to folder being watched
        extractFolder:
          type: string
          description: Path where services are extracted
        autoDelete:
          type: boolean
          description: Whether to auto-delete zip files after extraction
        port:
          type: integer
          description: Service port number

    ServiceItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Display name (cleaned of sort prefix)
        path:
          type: string
          description: Full path to the item
        type:
          type: string
          enum: [folder, song, presentation]
          description: Item type
        sortOrder:
          type: integer
          description: Numeric sort order
        children:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
          description: Child items (if applicable)

    ServiceSummary:
      type: object
      properties:
        id:
          type: string
          description: Unique service identifier
        name:
          type: string
          description: Service name
        path:
          type: string
          description: Path to extracted service
        itemCount:
          type: integer
          description: Number of items in the service
        extractedAt:
          type: string
          format: date-time
          description: When the service was extracted

    ExtractedService:
      type: object
      properties:
        id:
          type: string
          description: Unique service identifier
        name:
          type: string
          description: Service name
        path:
          type: string
          description: Path to extracted service
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
          description: Service items in sorted order
        extractedAt:
          type: string
          format: date-time
          description: When the service was extracted
        sourceZip:
          type: string
          description: Original zip file path

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        path:
          type: string
          description: Related path (if applicable)
