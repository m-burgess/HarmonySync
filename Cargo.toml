
[package]
name = "HarmonySync"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = "0.12.1"
rodio = { version = "0.18", features = ["symphonia-all"] }
cpal = "0.15"
midir = "0.10"
pitch_shift = "1.0"
fundsp = "0.18"
gstreamer = "0.22"
dasp = { version = "0.11", features = ["signal", "ring_buffer", "interpolate", "interpolate-linear"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15.4"

tempfile = "3.23.0"

