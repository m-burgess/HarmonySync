<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>harmonysync</title>
    <script>
      // CRITICAL: Check for electronAPI immediately
      console.log('[index.html] Script tag executing');
      console.log('[index.html] window.electronAPI:', typeof window.electronAPI);
      console.log('[index.html] window.__electronAPICached:', typeof window.__electronAPICached);
      console.log('[index.html] window.__preloadReady:', window.__preloadReady);
      
      // Preload ready check - ensures Electron preload has completed
      window.addEventListener('DOMContentLoaded', () => {
        console.log('[index.html] DOMContentLoaded fired');
        console.log('[index.html] electronAPI available:', !!window.electronAPI);
        console.log('[index.html] __electronAPICached available:', !!window.__electronAPICached);
        console.log('[index.html] __preloadReady:', window.__preloadReady);
        
        if (!window.electronAPI && !window.__electronAPICached) {
          console.error('[index.html] ⚠️ CRITICAL: electronAPI NOT FOUND!');
          console.error('[index.html] window keys:', Object.keys(window).filter(k => k.includes('electron') || k.includes('preload')));
        } else {
          console.log('[index.html] ✅ electronAPI is available');
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
