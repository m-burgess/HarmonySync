# Cargo build configuration for optimal performance

[build]
# Use all available CPU cores for compilation
jobs = 0  # 0 = use all cores

# Note: The linker configurations below are optional performance enhancements.
# If you encounter build errors, comment out the rustflags lines for your platform.
# The application will still build correctly with the default linker.

[target.x86_64-unknown-linux-gnu]
# Use lld linker for faster linking (optional, requires lld to be installed)
# Uncomment the line below if you have lld installed via: sudo apt install lld
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# For even faster linking with mold (if available)
# Install mold: https://github.com/rui314/mold
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
# Use lld-link on Windows for faster builds (optional)
# Uncomment if lld is available in your Rust installation
# rustflags = ["-C", "link-arg=-fuse-ld=lld-link"]

[target.x86_64-apple-darwin]
# macOS optimization flags (optional)
# Uncomment if you want to use lld linker on macOS
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Profile-guided optimization can be enabled for even better performance
# Requires running the app to generate profile data first
# See: https://doc.rust-lang.org/rustc/profile-guided-optimization.html
