[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
rand = "0.8.5"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
warp = "0.3"
once_cell = "1.19.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
anyhow = "1.0"
image = "0.25.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
ffmpeg-next = { version = "7.0.0", features = ["codec", "device", "filter", "format", "software-scaling", "image", "build"] }
dashmap = "6.0"
num_cpus = "1.16"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.15"

# Performance optimization profiles
[profile.release]
# Enable Link Time Optimization for better performance
lto = true
# Reduce number of codegen units to improve optimization (slower compile, faster runtime)
codegen-units = 1
# Optimize for size and speed
opt-level = 3
# Abort on panic rather than unwinding (smaller binary, faster)
panic = 'abort'
# Strip debug symbols from release builds
strip = true

[profile.dev]
# Faster linking in development
# split-debuginfo = "unpacked"  # Uncomment on macOS for faster builds

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
