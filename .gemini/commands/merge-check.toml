description = "Check whether a PR meets the merge rule (CI green, QA pass on head SHA, test coverage)"
prompt = """
You are the Project Lead. Check PR {{args}} against the merge rule in GEMINI.md.

!{gh pr view {{args}} --json number,title,headRefOid,mergeable,reviewDecision,statusCheckRollup,files,comments}

Report a checklist:
1. CI green on headRefOid? (every check SUCCESS)
2. A QA PASS comment naming exactly headRefOid? (older SHAs don't count)
3. A test file changed or a covering test named?
4. Any "needs the user" item (workflow files, pushes to main, an open listen)?
If 1–3 pass and 4 is empty, say MERGEABLE and offer `gh pr merge {{args}} --squash --delete-branch` (ASSUMPTION: squash is the convention; check the repo settings). Otherwise list exactly what's missing and which role owns it.
"""
