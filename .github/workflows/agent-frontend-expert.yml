name: Frontend Expert Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the Frontend Expert agent'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  frontend-expert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Agent Placeholder
        run: |
          echo "Frontend Expert agent definition available at .github/agents/Frontend-Expert.md"
          echo "This agent should be invoked through GitHub Copilot interface"
          echo ""
          echo "Agent specializes in:"
          echo "- Frontend development using HTML, CSS, ReactJS, and TailwindCSS"
          echo "- Component architecture and responsive design"
          echo "- API integration and accessibility"
