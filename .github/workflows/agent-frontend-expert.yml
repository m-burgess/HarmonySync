name: Frontend Expert Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the Frontend Expert agent'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  frontend-expert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Frontend Expert Agent
        uses: github/copilot-agent-action@v1
        with:
          agent: .github/agents/Frontend-Expert.md
          prompt: ${{ inputs.prompt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
