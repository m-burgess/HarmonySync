name: Issue Agent Collaboration

on:
  issues:
    types: [opened]

jobs:
  backend-expert:
    uses: ./.github/workflows/agent-backend-expert.yml
    with:
      prompt: |
        A new issue has been created. Please analyze this issue from a backend perspective:
        
        Issue Title: ${{ github.event.issue.title }}
        Issue Body: ${{ github.event.issue.body }}
        Issue URL: ${{ github.event.issue.html_url }}
        
        Provide your expert analysis and recommendations for the backend aspects of this issue.
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-expert:
    uses: ./.github/workflows/agent-frontend-expert.yml
    with:
      prompt: |
        A new issue has been created. Please analyze this issue from a frontend perspective:
        
        Issue Title: ${{ github.event.issue.title }}
        Issue Body: ${{ github.event.issue.body }}
        Issue URL: ${{ github.event.issue.html_url }}
        
        Provide your expert analysis and recommendations for the frontend aspects of this issue.
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ux-designer:
