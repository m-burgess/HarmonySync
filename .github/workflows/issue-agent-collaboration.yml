name: Issue Agent Collaboration

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Note: Agent workflows are triggered manually via workflow_dispatch
  # The GitHub Copilot agents are invoked through the Copilot interface, not through GitHub Actions
  # This workflow serves as documentation of the collaboration process
  
  collaboration-info:
    runs-on: ubuntu-latest
    steps:
      - name: Post Collaboration Info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT="## 🤝 Multi-Agent Collaboration Process Started
          
          This issue will be analyzed by multiple specialized agents. The collaboration follows this sequence:
          
          ### Phase 1: Initial Analysis
          - 🔧 **Backend Expert**: Analyzes backend architecture, API design, database concerns
          - 🔗 **Integration Architect**: Reviews component integration and cross-system communication
          
          ### Phase 2: Frontend & UX
          - 🎨 **Frontend Expert**: Evaluates frontend implementation and component architecture  
          - 👤 **UX Designer**: Provides user experience and interface design perspective
          
          ### Phase 3: Specialized Systems
          - 🎬 **Media Systems Engineer**: Reviews audio/video processing and DMX lighting
          - 💻 **Cross-Platform Systems Expert**: Analyzes platform-specific considerations
          
          ### Phase 4: Quality & Workflow
          - ✅ **QA Testing Expert**: Defines testing strategy and quality assurance
          - ⚙️ **GitHub Workflow Expert**: Reviews CI/CD and workflow configurations
          
          ### Phase 5: Coordination
          - 📋 **Project Manager**: Synthesizes all feedback and creates implementation plan
          
          ---
          **Note**: Agents are invoked manually through GitHub Copilot. A PR will be created only after all agents have completed their analysis and the Project Manager has finalized the plan.
          
          To invoke agents, use the GitHub Copilot interface with the agent definitions in \`.github/agents/\`"
          
          echo "$COMMENT" | gh issue comment ${{ inputs.issue_number }} -F - -R ${{ github.repository }}
