name: Integration Architect Agent

on:
  issues:
    types: [opened]
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the Integration Architect agent'
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  trigger-collaboration:
    if: github.event_name == 'issues'
    uses: ./.github/workflows/issue-agent-collaboration.yml
    secrets: inherit

  integration-architect:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Integration Architect Agent
        uses: github/copilot-agent-action@v1
        with:
          agent: .github/agents/Integration-Architect.md
          prompt: ${{ inputs.prompt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
