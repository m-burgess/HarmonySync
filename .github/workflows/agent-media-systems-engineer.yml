name: Media Systems Engineer Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the Media Systems Engineer agent'
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  media-systems-engineer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Media Systems Engineer Agent
        uses: github/copilot-agent-action@v1
        with:
          agent: .github/agents/Media-Systems-Engineer.md
          prompt: ${{ inputs.prompt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
