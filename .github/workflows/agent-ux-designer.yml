name: UX Designer Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the UX Designer agent'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  ux-designer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Agent Placeholder
        run: |
          echo "UX Designer agent definition available at .github/agents/UX-Designer.md"
          echo "This agent should be invoked through GitHub Copilot interface"
          echo ""
          echo "Agent specializes in:"
          echo "- User experience and interface design"
          echo "- Usability and accessibility standards"
          echo "- Layout and interaction design"
