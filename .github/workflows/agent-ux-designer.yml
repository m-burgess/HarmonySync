name: UX Designer Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: 'The prompt for the UX Designer agent'
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

jobs:
  ux-designer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute UX Designer Agent
        uses: github/copilot-agent-action@v1
        with:
          agent: .github/agents/UX-Designer.md
          prompt: ${{ inputs.prompt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
