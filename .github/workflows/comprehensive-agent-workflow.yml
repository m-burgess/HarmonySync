          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          git add reports/07-product-owner-approval.md
          if git diff --cached --quiet; then
            echo "No PO approval changes to commit."
          else
            git commit -m "docs(report): Product Owner final approval"
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi

      - name: Upload Approval Report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: approval-report
          path: artifacts/07-product-owner-approval.md

      - name: Resolve PR number by head branch (if not provided)
        id: resolve-pr
        uses: actions/github-script@v7
