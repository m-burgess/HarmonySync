name: Comprehensive Multi-Agent Development Workflow

on:
  workflow_dispatch:
    inputs:
      feature_request:
        description: 'Feature or issue to be developed (high-level description)'
        required: true
        type: string
      project_context:
        description: 'Additional project context or constraints'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.feature_request }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Phase 1: Product Owner - High-Level Planning + NEW BRANCH + NEW PR
  # ============================================================================
  product-owner-planning:
    name: "🎯 Product Owner - High-Level Plan (Branch + PR)"
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.vars.outputs.branch_name }}
      base_branch: ${{ steps.vars.outputs.base_branch }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Compute branch/base variables
        id: vars
        shell: bash
        run: |
          FEATURE="${{ inputs.feature_request }}"
          SLUG=$(echo "$FEATURE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-+|-+$//g' | cut -c1-60)
          BRANCH="feature/${SLUG:-feature}"
          BASE="${{ github.event.repository.default_branch }}"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE" >> "$GITHUB_OUTPUT"

      - name: Create feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.vars.outputs.branch_name }}"
          git fetch --all --prune
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch exists, checking out"
            git checkout "$BRANCH"
          else
            echo "Creating new branch"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"
          fi

       - name: Create PR with checklist
        id: create-pr
        uses: actions/github-script@v7
        env:
          FEATURE_REQUEST: ${{ inputs.feature_request }}
          PROJECT_CONTEXT: ${{ inputs.project_context }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `${{ steps.vars.outputs.branch_name }}`;
            const base = `${{ steps.vars.outputs.base_branch }}`;
            const head = `${owner}:${branch}`;
            
            // Check if PR already exists
            const existingPRs = await github.paginate(github.rest.pulls.list, { 
              owner, repo, state: 'open', head 
            });
            
            if (existingPRs.length > 0) {
              core.setOutput('pr_number', String(existingPRs[0].number));
              core.setOutput('pr_url', existingPRs[0].html_url);
              console.log(`PR already exists: #${existingPRs[0].number}`);
              return;
            }
            
            // Create PR body with checklist
            const featureRequest = process.env.FEATURE_REQUEST || '';
            const projectContext = process.env.PROJECT_CONTEXT || '(none)';
            
            const body = featureRequest + '\n\n' +
              '**Context**: ' + projectContext + '\n\n' +
              'This PR implements the comprehensive multi-agent workflow for the requested feature.\n' +
              'As each phase completes, this checklist will be auto-updated by CI.\n\n' +
              '### Product Owner Checklist\n' +
              '- [ ] Vision & Scope defined\n' +
              '- [ ] Acceptance criteria documented\n' +
              '- [ ] Scope constraints identified\n' +
              '- [ ] MVVM guidelines provided\n\n' +
              '### Project Manager Checklist\n' +
              '- [ ] Backend plan prepared\n' +
              '- [ ] Frontend plan prepared\n' +
              '- [ ] QA plan prepared\n\n' +
              '### Backend Checklist\n' +
              '- [ ] Models implemented following MVVM\n' +
              '- [ ] ViewModels implemented with observable state\n' +
              '- [ ] Services integrated\n' +
              '- [ ] Cross-platform compatibility verified\n' +
              '- [ ] Integration points documented\n' +
              '- [ ] Code follows TypeScript best practices\n\n' +
              '### Frontend Checklist\n' +
              '- [ ] MVVM View components implemented\n' +
              '- [ ] Components properly bound to ViewModels\n' +
              '- [ ] No business logic in View components\n' +
              '- [ ] Styling complete with TailwindCSS\n' +
              '- [ ] Accessibility requirements met\n' +
              '- [ ] Responsive design verified\n' +
              '- [ ] Backend API integration working\n\n' +
              '### QA Checklist\n' +
              '- [ ] Unit tests\n' +
              '- [ ] Integration tests\n' +
              '- [ ] End-to-End tests\n' +
              '- [ ] Regression tests & Code Coverage reported\n\n' +
              '### Validation (Project Manager)\n' +
              '- [ ] Backend follows detailed backend plan\n' +
              '- [ ] Frontend follows detailed frontend plan\n' +
              '- [ ] QA covered all planned scenarios\n' +
              '- [ ] All dependencies addressed\n' +
              '- [ ] MVVM properly implemented\n' +
              '- [ ] All tests passing\n' +
              '- [ ] Code quality standards met\n' +
              '- [ ] Documentation complete\n' +
              '- [ ] No scope creep\n' +
              '- [ ] Backend and frontend integrated\n' +
              '- [ ] Cross-platform compatibility confirmed\n' +
              '- [ ] Performance requirements met\n\n' +
              '### Final Approval (Product Owner)\n' +
              '- [ ] Feature aligns with product vision\n' +
              '- [ ] User value clearly delivered\n' +
              '- [ ] MVP scope respected\n' +
              '- [ ] MVVM integrity maintained\n' +
              '- [ ] Volunteer-friendly\n' +
              '- [ ] Meets acceptance criteria\n' +
              '- [ ] No hidden automation/surprises\n' +
              '- [ ] Reliability prioritized\n' +
              '- [ ] Production-ready quality\n' +
              '- [ ] Cross-platform confirmed\n' +
              '- [ ] Docs adequate for users/developers';

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'feat: ' + featureRequest,
              body,
              head: branch,
              base
            });
            
            core.setOutput('pr_number', String(pr.data.number));
            core.setOutput('pr_url', pr.data.html_url);

      - name: Create Product Owner Plan using Copilot
        uses: github/github-copilot-cli@v1
        continue-on-error: true
        with:
          prompt: |
            As the Product Owner, review this feature request and create a high-level plan in plans/01-product-owner-plan.md:
            
            Feature: ${{ inputs.feature_request }}
            Context: ${{ inputs.project_context }}
            
            Include:
            - Vision & Scope
            - User value and success criteria
            - Acceptance criteria
            - Scope boundaries (MVP vs Phase 2+)
            - MVVM architecture guidelines for this feature

      - name: Commit and push Product Owner plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.vars.outputs.branch_name }}"
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"
          
          if [ -f plans/01-product-owner-plan.md ]; then
            git add plans/01-product-owner-plan.md
            git reset -- .github/workflows/ || true
            if ! git diff --cached --quiet; then
              git commit -m "docs(plan): Product Owner high-level plan"
              git push origin "$BRANCH"
            fi
          fi

      - name: Update PR checklist (PO items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.create-pr.outputs.pr_number }}`);

            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Vision & Scope defined",
              "Acceptance criteria documented",
              "Scope constraints identified",
              "MVVM guidelines provided"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 2: Project Manager - Detailed Planning
  # ============================================================================
  project-manager-planning:
    name: "📋 Project Manager - Detailed Planning"
    runs-on: ubuntu-latest
    needs: product-owner-planning
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}

      - name: Create Project Manager Plans using Copilot
        uses: github/github-copilot-cli@v1
        continue-on-error: true
        with:
          prompt: |
            As the Project Manager, read plans/01-product-owner-plan.md and create detailed implementation plans in plans/02-project-manager-plans.md:
            
            Create three detailed plans:
            1. Backend Expert Plan - API design, data models, MVVM implementation, cross-platform requirements
            2. Frontend Expert Plan - React component architecture, UI/UX, accessibility, styling with TailwindCSS
            3. QA Testing Expert Plan - Test strategy, test cases, coverage requirements
            
            Be specific and actionable. Reference the codebase structure.

      - name: Commit and push PM plans
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ needs.product-owner-planning.outputs.branch_name }}"
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"
          
          if [ -f plans/02-project-manager-plans.md ]; then
            git add plans/02-project-manager-plans.md
            git reset -- .github/workflows/ || true
            if ! git diff --cached --quiet; then
              git commit -m "docs(plan): Project Manager detailed plans"
              git push origin "$BRANCH"
            fi
          fi

      - name: Update PR checklist (PM items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Backend plan prepared",
              "Frontend plan prepared",
              "QA plan prepared"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 3: Backend Expert - Implementation
  # ============================================================================
  backend-implementation:
    name: "🔧 Backend Expert - Implementation"
    runs-on: ubuntu-latest
    needs: [product-owner-planning, project-manager-planning]
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}
          fetch-depth: 0

      - name: Implement Backend using Copilot Coding Agent
        uses: github/create-pr-with-copilot@v1
        with:
          problem_statement: |
            As the Backend Expert, implement the backend requirements for this feature.
            
            Read and follow the detailed backend plan in plans/02-project-manager-plans.md.
            
            Tasks to complete:
            - Implement Models following MVVM architecture
            - Implement ViewModels with observable state
            - Integrate necessary services (audio, file processing, etc.)
            - Ensure cross-platform compatibility (Windows, macOS, Linux)
            - Document all integration points
            - Follow TypeScript best practices
            - Write inline code documentation
            
            DO NOT modify workflow files in .github/workflows/
            
            Mark each task complete as you finish it. All backend checklist items must be implemented.
          branch: ${{ needs.product-owner-planning.outputs.branch_name }}
          update_existing_pr: true
          pr_number: ${{ needs.product-owner-planning.outputs.pr_number }}

      - name: Verify Backend Implementation
        shell: bash
        run: |
          echo "Checking for backend implementation changes..."
          git log -5 --oneline

      - name: Update PR checklist (Backend items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Models implemented following MVVM",
              "ViewModels implemented with observable state",
              "Services integrated",
              "Cross-platform compatibility verified",
              "Integration points documented",
              "Code follows TypeScript best practices"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 4: Frontend Expert - Implementation
  # ============================================================================
  frontend-implementation:
    name: "🎨 Frontend Expert - Implementation"
    runs-on: ubuntu-latest
    needs: [product-owner-planning, backend-implementation]
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}
          fetch-depth: 0

      - name: Implement Frontend using Copilot Coding Agent
        uses: github/create-pr-with-copilot@v1
        with:
          problem_statement: |
            As the Frontend Expert, implement the frontend requirements for this feature.
            
            Read and follow the detailed frontend plan in plans/02-project-manager-plans.md.
            Review the backend implementation to understand the APIs and ViewModels available.
            
            Tasks to complete:
            - Implement MVVM View components (stateless React components)
            - Properly bind components to ViewModels
            - Keep business logic OUT of View components
            - Style components with TailwindCSS
            - Ensure accessibility (ARIA labels, keyboard navigation)
            - Verify responsive design works on all screen sizes
            - Integrate with backend APIs
            
            DO NOT modify workflow files in .github/workflows/
            
            Mark each task complete as you finish it. All frontend checklist items must be implemented.
          branch: ${{ needs.product-owner-planning.outputs.branch_name }}
          update_existing_pr: true
          pr_number: ${{ needs.product-owner-planning.outputs.pr_number }}

      - name: Update PR checklist (Frontend items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "MVVM View components implemented",
              "Components properly bound to ViewModels",
              "No business logic in View components",
              "Styling complete with TailwindCSS",
              "Accessibility requirements met",
              "Responsive design verified",
              "Backend API integration working"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 5: QA Testing Expert - Testing & Validation
  # ============================================================================
  qa-testing:
    name: "✅ QA Testing Expert - Testing & Validation"
    runs-on: ubuntu-latest
    needs: [product-owner-planning, frontend-implementation]
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}
          fetch-depth: 0

      - name: Implement Tests using Copilot Coding Agent
        uses: github/create-pr-with-copilot@v1
        with:
          problem_statement: |
            As the QA Testing Expert, create comprehensive tests for this feature.
            
            Read and follow the QA plan in plans/02-project-manager-plans.md.
            Review the backend and frontend implementation.
            
            Tasks to complete:
            - Write unit tests for backend Models and ViewModels
            - Write unit tests for frontend components
            - Write integration tests for API endpoints
            - Write integration tests for ViewModel-View bindings
            - Write end-to-end tests for complete user workflows
            - Run regression tests to ensure existing functionality works
            - Generate test coverage report
            
            DO NOT modify workflow files in .github/workflows/
            
            All tests must pass. Achieve minimum 80% code coverage on new code.
          branch: ${{ needs.product-owner-planning.outputs.branch_name }}
          update_existing_pr: true
          pr_number: ${{ needs.product-owner-planning.outputs.pr_number }}

      - name: Update PR checklist (QA items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Unit tests",
              "Integration tests",
              "End-to-End tests",
              "Regression tests & Code Coverage reported"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 6: Project Manager - Validation Review
  # ============================================================================
  project-manager-validation:
    name: "📋 Project Manager - Validation Review"
    runs-on: ubuntu-latest
    needs: [product-owner-planning, qa-testing]
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}
          fetch-depth: 0

      - name: Validate Implementation using Copilot
        uses: github/create-pr-with-copilot@v1
        with:
          problem_statement: |
            As the Project Manager, validate that the implementation matches the plans.
            
            Review:
            - plans/02-project-manager-plans.md (the original detailed plans)
            - The backend implementation
            - The frontend implementation  
            - The test implementation
            
            Create a validation report in reports/validation-report.md that confirms:
            - Backend follows the detailed backend plan
            - Frontend follows the detailed frontend plan
            - QA covered all planned scenarios
            - All dependencies properly addressed
            - MVVM architecture properly implemented
            - All tests passing
            - Code quality standards met
            - Documentation complete
            - No scope creep detected
            - Backend and frontend properly integrated
            - Cross-platform compatibility confirmed
            - Performance requirements met
            
            If any items are NOT complete, list them clearly and request fixes.
            DO NOT modify workflow files in .github/workflows/
          branch: ${{ needs.product-owner-planning.outputs.branch_name }}
          update_existing_pr: true
          pr_number: ${{ needs.product-owner-planning.outputs.pr_number }}

      - name: Update PR checklist (Validation items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Backend follows detailed backend plan",
              "Frontend follows detailed frontend plan",
              "QA covered all planned scenarios",
              "All dependencies addressed",
              "MVVM properly implemented",
              "All tests passing",
              "Code quality standards met",
              "Documentation complete",
              "No scope creep",
              "Backend and frontend integrated",
              "Cross-platform compatibility confirmed",
              "Performance requirements met"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 7: Product Owner - Final Vision Approval
  # ============================================================================
  product-owner-approval:
    name: "🎯 Product Owner - Final Approval"
    runs-on: ubuntu-latest
    needs: [product-owner-planning, project-manager-validation]
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}
          fetch-depth: 0

      - name: Final Product Owner Review using Copilot
        uses: github/create-pr-with-copilot@v1
        with:
          problem_statement: |
            As the Product Owner, perform final vision alignment review.
            
            Review:
            - plans/01-product-owner-plan.md (the original high-level plan)
            - reports/validation-report.md (the PM validation)
            - The complete implementation
            
            Create a final approval report in reports/final-approval.md that confirms:
            - Feature aligns with product vision
            - User value clearly delivered
            - MVP scope respected (no scope creep)
            - MVVM architecture integrity maintained
            - Implementation is volunteer-friendly
            - Meets acceptance criteria from high-level plan
            - No hidden automation or surprises
            - Reliability prioritized over features
            - Production-ready quality
            - Cross-platform confirmed
            - Documentation adequate for users and developers
            
            If approved, clearly state "APPROVED FOR RELEASE" in the report.
            If not approved, list specific issues and request fixes.
            
            DO NOT modify workflow files in .github/workflows/
          branch: ${{ needs.product-owner-planning.outputs.branch_name }}
          update_existing_pr: true
          pr_number: ${{ needs.product-owner-planning.outputs.pr_number }}

      - name: Update PR checklist (Final Approval items)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Feature aligns with product vision",
              "User value clearly delivered",
              "MVP scope respected",
              "MVVM integrity maintained",
              "Volunteer-friendly",
              "Meets acceptance criteria",
              "No hidden automation/surprises",
              "Reliability prioritized",
              "Production-ready quality",
              "Cross-platform confirmed",
              "Docs adequate for users/developers"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

      - name: Mark PR as ready for review
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number(`${{ needs.product-owner-planning.outputs.pr_number }}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: '✅ **All phases complete!** This PR is ready for human review and merge.'
            });
