              "No hidden automation/surprises",
              "Reliability prioritized",
              "Production-ready quality",
              "Cross-platform confirmed",
              "Docs adequate for users/developers"
            ]);
            // Mark YES decision (leave NO unchecked)
            body = body.replace(/- \[ \] \*\*YES\*\*/, '- [x] **YES**');
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 8: Final Run Summary (UI)
  # ============================================================================
  workflow-summary:
    name: "📊 Workflow Summary"
    runs-on: ubuntu-latest
    needs: product-owner-approval
    steps:
      - name: Resolve PR number (for summary)
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const provided = `${{ needs.product-owner-planning.outputs.pr_number }}`.trim();
            const branch = `${{ needs.product-owner-planning.outputs.branch_name }}`.trim();
            if (provided) { core.setOutput('pr_number', provided); return; }
            const head = `${owner}:${branch}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head });
            core.setOutput('pr_number', prs.length ? String(prs[0].number) : '');

      - name: Fetch PR URL (if exists)
        id: pr-url
        if: ${{ steps.resolve-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(`${{ steps.resolve-pr.outputs.pr_number }}`);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            core.setOutput('url', pr.html_url);

      - name: Display Summary
        shell: bash
        run: |
          echo "## 🎉 Comprehensive Multi-Agent Workflow Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Feature Branch**: \`${{ needs.product-owner-planning.outputs.branch_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.pr-url.outputs.url }}" ]; then
            echo "- **PR**: ${{ steps.pr-url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **PR**: Not created by CI (policy). Open manually: https://github.com/${{ github.repository }}/compare/${{ needs.product-owner-planning.outputs.base_branch }}...${{ needs.product-owner-planning.outputs.branch_name }}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the PR checklist for auto-updated status of each phase (if PR exists)." >> "$GITHUB_STEP_SUMMARY"
