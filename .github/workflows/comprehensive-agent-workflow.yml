name: Comprehensive Multi-Agent Development Workflow

on:
  workflow_dispatch:
    inputs:
      feature_request:
        description: 'Feature or issue to be developed (high-level description)'
        required: true
        type: string
      project_context:
        description: 'Additional project context or constraints'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

# Prevent concurrent runs from racing on the same feature (by request text + branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.feature_request }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Phase 1: Product Owner - High-Level Planning + NEW BRANCH + (attempt) NEW PR
  # ============================================================================
  product-owner-planning:
    name: "🎯 Product Owner - High-Level Plan (Branch + PR)"
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.vars.outputs.branch_name }}
      base_branch: ${{ steps.vars.outputs.base_branch }}
      pr_number: ${{ steps.pr-outputs.outputs.pr_number }}
      pr_url: ${{ steps.pr-outputs.outputs.pr_url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Compute branch/base variables
        id: vars
        shell: bash
        run: |
          FEATURE="${{ inputs.feature_request }}"
          SLUG=$(echo "$FEATURE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-+|-+$//g' | cut -c1-60)
          BRANCH="feature/${SLUG:-feature}"
          BASE="${{ github.event.repository.default_branch }}"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE" >> "$GITHUB_OUTPUT"

      - name: Create High-Level Plan (file content)
        shell: bash
        env:
          FEATURE_REQUEST: ${{ inputs.feature_request }}
          PROJECT_CONTEXT: ${{ inputs.project_context }}
        run: |
          mkdir -p plans artifacts
          {
            echo "## Product Owner High-Level Plan"
            echo
            echo "**Feature Request**: ${FEATURE_REQUEST}"
            echo
            echo "**Context**: ${PROJECT_CONTEXT}"
            echo
            echo "### Vision & Scope"
            echo "- The Product Owner agent (Product-owner.md) should:"
            echo "  - Review the feature request against HarmonySync product vision"
            echo "  - Define user value and success criteria"
            echo "  - Establish scope boundaries (MVP vs Phase 2+)"
            echo "  - Ensure MVVM architecture compliance"
            echo "  - Create high-level epics and user stories"
            echo
            echo "### Deliverables for Project Manager"
            echo "- High-level requirements document"
            echo "- Acceptance criteria"
            echo "- Scope constraints"
            echo "- MVVM architecture guidelines for this feature"
            echo
            echo "---"
            echo "**Status**: Ready for Project Manager review"
          } > plans/01-product-owner-plan.md
          cp plans/01-product-owner-plan.md artifacts/01-product-owner-plan.md

      - name: Create or update feature branch and push initial plan (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${{ steps.vars.outputs.branch_name }}"
          git fetch --all --prune

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch '$BRANCH' exists. Checking out and rebasing..."
            git checkout "$BRANCH"
            git pull --rebase origin "$BRANCH"
          else
            echo "Remote branch '$BRANCH' does not exist. Creating it..."
            git checkout -b "$BRANCH"
          fi

          git add plans/01-product-owner-plan.md
          if git diff --cached --quiet; then
            echo "No changes to commit for Product Owner plan."
          else
            git commit -m "docs(plan): Product Owner high-level plan for '${{ inputs.feature_request }}'"
            if ! git push origin "$BRANCH"; then
              echo "Normal push failed, attempting --force-with-lease."
              git push --force-with-lease origin "$BRANCH"
            fi
          fi

      - name: Build initial PR body with master checklist
        id: build-pr-body
        shell: bash
        env:
          FEATURE_REQUEST: ${{ inputs.feature_request }}
          PROJECT_CONTEXT: ${{ inputs.project_context }}
        run: |
          {
            echo "${FEATURE_REQUEST}"
            echo
            if [ -n "${PROJECT_CONTEXT}" ]; then
              echo "**Context**: ${PROJECT_CONTEXT}"
            else
              echo "**Context**: (none)"
            fi
            echo
            echo "This PR implements the comprehensive multi-agent workflow for the requested feature."
            echo "As each phase completes, this checklist will be auto-updated by CI."
            echo
            echo "### Product Owner Checklist"
            echo "- [ ] Vision & Scope defined"
            echo "- [ ] Acceptance criteria documented"
            echo "- [ ] Scope constraints identified"
            echo "- [ ] MVVM guidelines provided"
            echo
            echo "### Project Manager Checklist"
            echo "- [ ] Backend plan prepared"
            echo "- [ ] Frontend plan prepared"
            echo "- [ ] QA plan prepared"
            echo
            echo "### Backend Checklist"
            echo "- [ ] Models implemented following MVVM"
            echo "- [ ] ViewModels implemented with observable state"
            echo "- [ ] Services integrated"
            echo "- [ ] Cross-platform compatibility verified"
            echo "- [ ] Integration points documented"
            echo "- [ ] Code follows TypeScript best practices"
            echo
            echo "### Frontend Checklist"
            echo "- [ ] MVVM View components implemented"
            echo "- [ ] Components properly bound to ViewModels"
            echo "- [ ] No business logic in View components"
            echo "- [ ] Styling complete with TailwindCSS"
            echo "- [ ] Accessibility requirements met"
            echo "- [ ] Responsive design verified"
            echo "- [ ] Backend API integration working"
            echo
            echo "### QA Checklist"
            echo "- [ ] Unit tests"
            echo "- [ ] Integration tests"
            echo "- [ ] End-to-End tests"
            echo "- [ ] Regression tests & Code Coverage reported"
            echo
            echo "### Validation (Project Manager)"
            echo "- [ ] Backend follows detailed backend plan"
            echo "- [ ] Frontend follows detailed frontend plan"
            echo "- [ ] QA covered all planned scenarios"
            echo "- [ ] All dependencies addressed"
            echo "- [ ] MVVM properly implemented"
            echo "- [ ] All tests passing"
            echo "- [ ] Code quality standards met"
            echo "- [ ] Documentation complete"
            echo "- [ ] No scope creep"
            echo "- [ ] Backend and frontend integrated"
            echo "- [ ] Cross-platform compatibility confirmed"
            echo "- [ ] Performance requirements met"
            echo
            echo "### Final Approval (Product Owner)"
            echo "- [ ] Feature aligns with product vision"
            echo "- [ ] User value clearly delivered"
            echo "- [ ] MVP scope respected"
            echo "- [ ] MVVM integrity maintained"
            echo "- [ ] Volunteer-friendly"
            echo "- [ ] Meets acceptance criteria"
            echo "- [ ] No hidden automation/surprises"
            echo "- [ ] Reliability prioritized"
            echo "- [ ] Production-ready quality"
            echo "- [ ] Cross-platform confirmed"
            echo "- [ ] Docs adequate for users/developers"
          } > pr.md

      # Attempt to create PR; uses PAT if provided, otherwise GITHUB_TOKEN. Skips gracefully if blocked.
      - name: Create Pull Request (if permitted)
        id: cpr
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          title: "feat: ${{ inputs.feature_request }}"
          body-path: pr.md
          branch: ${{ steps.vars.outputs.branch_name }}
          base: ${{ steps.vars.outputs.base_branch }}
          draft: false
          signoff: true
          token: ${{ secrets.PR_TOKEN || github.token }}

      - name: Set PR outputs (may be empty if blocked)
        id: pr-outputs
        shell: bash
        env:
          PR_NO: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "pr_number=${PR_NO}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Show manual PR link if PR creation blocked
        if: ${{ steps.pr-outputs.outputs.pr_number == '' }}
        shell: bash
        run: |
          echo "::warning title=PR not created::Your org/repo policy blocks PR creation by GitHub Actions."
          echo "::notice title=Manual action::Open a PR here:"
          echo "https://github.com/${{ github.repository }}/compare/${{ steps.vars.outputs.base_branch }}...${{ steps.vars.outputs.branch_name }}?expand=1"

      - name: Upload Product Owner Plan (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: product-owner-plan
          path: artifacts/01-product-owner-plan.md

      # Only mark PO items if PR exists from CI
      - name: Update PR checklist (PO items)
        if: ${{ steps.pr-outputs.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.pr-outputs.outputs.pr_number }}`);

            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Vision & Scope defined",
              "Acceptance criteria documented",
              "Scope constraints identified",
              "MVVM guidelines provided"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # Helper reusable step to resolve PR by head branch exists in each job via inline steps below

  # ============================================================================
  # Phase 2: Project Manager - Detailed Planning (updates PR if exists)
  # ============================================================================
  project-manager-planning:
    name: "📋 Project Manager - Detailed Planning"
    runs-on: ubuntu-latest
    needs: product-owner-planning
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}

      - name: Create Detailed Plans
        shell: bash
        run: |
          mkdir -p plans artifacts
          {
            echo "## Project Manager - Detailed Implementation Plans"
            echo
            echo "**Based on Product Owner Plan**"
            echo
            echo "### Backend Expert Plan"
            echo "**Agent**: Backend-Expert.md"
            echo "**Helper Agents Available:**"
            echo "- Cross-Platform-Systems-Expert.md"
            echo "- Integration-Architect.md"
            echo "- Node.js Expert.agent.md"
            echo "- OOP-Design-Expert.md"
            echo "- Typescript-Expert.agent.md"
            echo
            echo "**Tasks:**"
            echo "- Review backend architecture requirements"
            echo "- Design API endpoints and data models"
            echo "- Plan database schema changes"
            echo "- Implement backend logic following MVVM pattern"
            echo "- Ensure cross-platform compatibility"
            echo "- Coordinate with Integration Architect for component communication"
            echo
            echo "### Frontend Expert Plan"
            echo "**Agent**: Frontend-Expert.md"
            echo "**Helper Agents Available:**"
            echo "- Node.js Expert.agent.md"
            echo "- Typescript-Expert.agent.md"
            echo "- UX-Designer.md"
            echo
            echo "**Tasks:**"
            echo "- Design React component architecture"
            echo "- Create UI mockups with UX Designer"
            echo "- Implement Views following MVVM pattern"
            echo "- Ensure accessibility and responsive design"
            echo "- Integrate with backend APIs"
            echo
            echo "### QA Testing Expert Plan"
            echo "**Agent**: QA-Testing-Expert.md"
            echo "**Tasks:**"
            echo "- Define test strategy (unit, integration, e2e)"
            echo "- Create test cases for all new functionality"
            echo "- Validate backend logic and API contracts"
            echo "- Test frontend components and user workflows"
            echo "- Verify cross-platform compatibility"
            echo "- Run regression tests"
            echo "- Generate test coverage reports"
            echo
            echo "---"
            echo "**Status**: Plans ready for implementation"
          } > plans/02-project-manager-plans.md

          cp plans/02-project-manager-plans.md artifacts/02-project-manager-plans.md

      - name: Commit and push PM plans (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${{ needs.product-owner-planning.outputs.branch_name }}"
          git fetch --all --prune
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          git add plans/02-project-manager-plans.md
          if git diff --cached --quiet; then
            echo "No PM plan changes to commit."
          else
            git commit -m "docs(plan): Project Manager detailed plans"
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi

      - name: Upload Project Manager Plans (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: project-manager-plans
          path: artifacts/02-project-manager-plans.md

      - name: Resolve PR number by head branch (if not provided)
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const provided = `${{ needs.product-owner-planning.outputs.pr_number }}`.trim();
            const branch = `${{ needs.product-owner-planning.outputs.branch_name }}`.trim();
            if (provided) { core.setOutput('pr_number', provided); return; }
            const head = `${owner}:${branch}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head });
            core.setOutput('pr_number', prs.length ? String(prs[0].number) : '');

      - name: Update PR checklist (PM items)
        if: ${{ steps.resolve-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.resolve-pr.outputs.pr_number }}`);
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Backend plan prepared",
              "Frontend plan prepared",
              "QA plan prepared"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 3: Backend Expert - Implementation (updates PR if exists)
  # ============================================================================
  backend-implementation:
    name: "🔧 Backend Expert - Implementation"
    runs-on: ubuntu-latest
    needs: project-manager-planning
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}

      - name: Backend Implementation Report
        shell: bash
        run: |
          mkdir -p reports artifacts
          {
            echo "## Backend Expert - Implementation Report"
            echo
            echo "**Primary Agent**: Backend-Expert.md"
            echo
            echo "### Implementation Steps"
            echo "1. Review the detailed backend plan from Project Manager"
            echo "2. Implement backend logic using Node.js/TypeScript"
            echo "3. Follow MVVM architecture (Model and ViewModel layers)"
            echo "4. Utilize helper agents as needed"
            echo "5. Create/Update Models"
            echo "6. Create/Update ViewModels"
            echo "7. Implement services (audio, file processing, etc.)"
            echo "8. Document all new APIs and interfaces"
            echo
            echo "### Backend Checklist"
            echo "- [ ] Models implemented following MVVM"
            echo "- [ ] ViewModels implemented with observable state"
            echo "- [ ] Services integrated"
            echo "- [ ] Cross-platform compatibility verified"
            echo "- [ ] Integration points documented"
            echo "- [ ] Code follows TypeScript best practices"
            echo
            echo "---"
            echo "**Status**: Backend implementation ready for Frontend phase"
          } > reports/03-backend-report.md
          cp reports/03-backend-report.md artifacts/03-backend-report.md

      - name: Commit and push backend report (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${{ needs.product-owner-planning.outputs.branch_name }}"
          git fetch --all --prune
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          git add reports/03-backend-report.md
          if git diff --cached --quiet; then
            echo "No backend report changes to commit."
          else
            git commit -m "docs(report): Backend implementation report"
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi

      - name: Upload Backend Report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: artifacts/03-backend-report.md

      - name: Resolve PR number by head branch (if not provided)
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const provided = `${{ needs.product-owner-planning.outputs.pr_number }}`.trim();
            const branch = `${{ needs.product-owner-planning.outputs.branch_name }}`.trim();
            if (provided) { core.setOutput('pr_number', provided); return; }
            const head = `${owner}:${branch}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head });
            core.setOutput('pr_number', prs.length ? String(prs[0].number) : '');

      - name: Update PR checklist (Backend items)
        if: ${{ steps.resolve-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.resolve-pr.outputs.pr_number }}`);
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Models implemented following MVVM",
              "ViewModels implemented with observable state",
              "Services integrated",
              "Cross-platform compatibility verified",
              "Integration points documented",
              "Code follows TypeScript best practices"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 4: Frontend Expert - Implementation (updates PR if exists)
  # ============================================================================
  frontend-implementation:
    name: "🎨 Frontend Expert - Implementation"
    runs-on: ubuntu-latest
    needs: backend-implementation
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}

      - name: Frontend Implementation Report
        shell: bash
        run: |
          mkdir -p reports artifacts
          {
            echo "## Frontend Expert - Implementation Report"
            echo
            echo "**Primary Agent**: Frontend-Expert.md"
            echo
            echo "### Implementation Steps"
            echo "1. Review the detailed frontend plan from Project Manager"
            echo "2. Review backend implementation for API integration"
            echo "3. Implement React components following MVVM (View layer)"
            echo "4. Utilize helper agents as needed"
            echo "5. Create stateless React components"
            echo "6. Bind components to ViewModels"
            echo "7. Implement styling with TailwindCSS"
            echo "8. Ensure accessibility (ARIA, keyboard navigation)"
            echo "9. Test responsive design"
            echo
            echo "### Frontend Checklist"
            echo "- [ ] MVVM View components implemented"
            echo "- [ ] Components properly bound to ViewModels"
            echo "- [ ] No business logic in View components"
            echo "- [ ] Styling complete with TailwindCSS"
            echo "- [ ] Accessibility requirements met"
            echo "- [ ] Responsive design verified"
            echo "- [ ] Backend API integration working"
            echo
            echo "---"
            echo "**Status**: Frontend implementation ready for QA phase"
          } > reports/04-frontend-report.md
          cp reports/04-frontend-report.md artifacts/04-frontend-report.md

      - name: Commit and push frontend report (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${{ needs.product-owner-planning.outputs.branch_name }}"
          git fetch --all --prune
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          git add reports/04-frontend-report.md
          if git diff --cached --quiet; then
            echo "No frontend report changes to commit."
          else
            git commit -m "docs(report): Frontend implementation report"
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi

      - name: Upload Frontend Report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: artifacts/04-frontend-report.md

      - name: Resolve PR number by head branch (if not provided)
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const provided = `${{ needs.product-owner-planning.outputs.pr_number }}`.trim();
            const branch = `${{ needs.product-owner-planning.outputs.branch_name }}`.trim();
            if (provided) { core.setOutput('pr_number', provided); return; }
            const head = `${owner}:${branch}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head });
            core.setOutput('pr_number', prs.length ? String(prs[0].number) : '');

      - name: Update PR checklist (Frontend items)
        if: ${{ steps.resolve-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.resolve-pr.outputs.pr_number }}`);
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "MVVM View components implemented",
              "Components properly bound to ViewModels",
              "No business logic in View components",
              "Styling complete with TailwindCSS",
              "Accessibility requirements met",
              "Responsive design verified",
              "Backend API integration working"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

  # ============================================================================
  # Phase 5: QA Testing Expert - Testing & Validation (updates PR if exists)
  # ============================================================================
  qa-testing:
    name: "✅ QA Testing Expert - Testing & Validation"
    runs-on: ubuntu-latest
    needs: frontend-implementation
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.product-owner-planning.outputs.branch_name }}

      - name: QA Testing Report
        shell: bash
        run: |
          mkdir -p reports artifacts
          {
            echo "## QA Testing Expert - Testing Report"
            echo
            echo "**Primary Agent**: QA-Testing-Expert.md"
            echo
            echo "### Testing Execution"
            echo
            echo "#### Unit Tests"
            echo "- [ ] Backend Model tests"
            echo "- [ ] Backend ViewModel tests"
            echo "- [ ] Frontend component tests"
            echo "- [ ] Service layer tests"
            echo
            echo "#### Integration Tests"
            echo "- [ ] API endpoint tests"
            echo "- [ ] Component integration tests"
            echo "- [ ] ViewModel-View binding tests"
            echo "- [ ] Service integration tests"
            echo
            echo "#### End-to-End Tests"
            echo "- [ ] Complete user workflows"
            echo "- [ ] Cross-platform functionality"
            echo "- [ ] Performance benchmarks"
            echo "- [ ] Accessibility audits"
            echo
            echo "#### Regression Tests"
            echo "- [ ] Existing functionality not broken"
            echo "- [ ] MVVM boundaries maintained"
            echo
            echo "### Test Results Summary"
            echo "- **Total Tests Run**: [To be filled by QA agent]"
            echo "- **Tests Passed**: [To be filled by QA agent]"
            echo "- **Tests Failed**: [To be filled by QA agent]"
            echo "- **Code Coverage**: [To be filled by QA agent]"
            echo
            echo "---"
            echo "**Status**: Testing complete - ready for Project Manager review"
          } > reports/05-qa-report.md
          cp reports/05-qa-report.md artifacts/05-qa-report.md

      - name: Commit and push QA report (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${{ needs.product-owner-planning.outputs.branch_name }}"
          git fetch --all --prune
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          git add reports/05-qa-report.md
          if git diff --cached --quiet; then
            echo "No QA report changes to commit."
          else
            git commit -m "docs(report): QA testing report"
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi

      - name: Upload QA Report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: artifacts/05-qa-report.md

      - name: Resolve PR number by head branch (if not provided)
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const provided = `${{ needs.product-owner-planning.outputs.pr_number }}`.trim();
            const branch = `${{ needs.product-owner-planning.outputs.branch_name }}`.trim();
            if (provided) { core.setOutput('pr_number', provided); return; }
            const head = `${owner}:${branch}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head });
            core.setOutput('pr_number', prs.length ? String(prs[0].number) : '');

      - name: Update PR checklist (QA items)
        if: ${{ steps.resolve-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(`${{ steps.resolve-pr.outputs.pr_number }}`);
            function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function check(body, items){
              for(const text of items){
                const unchecked = new RegExp(`- \\[ \\] ${esc(text)}`, 'g');
                body = body.replace(unchecked, `- [x] ${text}`);
              }
              return body;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            let body = pr.body || "";
            body = check(body, [
              "Unit tests",
              "Integration tests",
              "End-to-End tests",
              "Regression tests & Code Coverage reported"
            ]);
            await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body });

