name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: harmonysync/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Install dependencies
        working-directory: ./harmonysync
        run: npm ci

      - name: Build frontend
        working-directory: ./harmonysync
        run: npm run build

      - name: Build macOS app (Universal)
        working-directory: ./harmonysync
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonysync-macos-dmg
          path: harmonysync/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: harmonysync-macos-app
          path: harmonysync/src-tauri/target/release/bundle/macos/*.app

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-20.04  # Use older LTS for better compatibility
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: harmonysync/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install dependencies
        working-directory: ./harmonysync
        run: npm ci

      - name: Build frontend
        working-directory: ./harmonysync
        run: npm run build

      - name: Build Linux packages
        working-directory: ./harmonysync
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: harmonysync-linux-appimage
          path: harmonysync/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Deb package
        uses: actions/upload-artifact@v4
        with:
          name: harmonysync-linux-deb
          path: harmonysync/src-tauri/target/release/bundle/deb/*.deb
