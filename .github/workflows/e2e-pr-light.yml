name: PR Smoke Build and Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-smoke-${{ github.head_ref }}
  cancel-in-progress: true

# C++/Qt smoke for this repo: no root package.json / pnpm workspace.
# Qt is required because AILyricSyncService.hpp hard-defines HARMONYSYNC_QT_AVAILABLE.
jobs:
  build-and-smoke:
    name: Build workspace and run smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Install C++ build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.8.2'
          target: desktop
          cache: true
          install-deps: 'true'
          # Matches root CMakeLists find_package(Qt6 COMPONENTS ... Multimedia WebSockets ...)
          # Core/Gui/Quick/QuickControls2/Test come with the default desktop archives.
          modules: 'qtmultimedia qtwebsockets'

      - name: Configure CMake (C++ core/media with Qt)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build smoke test targets
        shell: bash
        run: |
          cmake --build build --target \
            test_audio_engine \
            test_models \
            test_audio_dsp \
            test_qml_stem_mixer_panel \
            -j "$(nproc)"

      - name: Run smoke CTest suite
        shell: bash
        run: |
          ctest --test-dir build \
            -R '^(test_audio_engine|test_models|test_audio_dsp|test_qml_stem_mixer_panel)$' \
            --output-on-failure \
            --no-tests=error
