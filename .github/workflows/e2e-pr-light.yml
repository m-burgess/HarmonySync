name: PR Smoke Build and Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-smoke-${{ github.head_ref }}
  cancel-in-progress: true

# Honest light smoke for this C++/Qt repo: no root package.json / pnpm workspace exists.
# Build and run the C++ tests this PR owns without installing Qt (HARMONYSYNC_HAS_QT off).
jobs:
  build-and-smoke:
    name: Build workspace and run smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Configure CMake (C++ core/media, no Qt)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build smoke test targets
        shell: bash
        run: |
          cmake --build build --target \
            test_audio_engine \
            test_models \
            test_audio_dsp \
            -j "$(nproc)"

      - name: Run smoke CTest suite
        shell: bash
        run: |
          ctest --test-dir build \
            -R '^(test_audio_engine|test_models|test_audio_dsp)$' \
            --output-on-failure \
            --no-tests=error
