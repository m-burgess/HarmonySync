name: PR Smoke Build and Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-smoke-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build workspace and run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable corepack and prepare pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies (fast)
        shell: bash
        run: |
          pnpm install -w --frozen-lockfile --prefer-offline

      - name: Build workspace
        shell: bash
        run: |
          pnpm -w build

      - name: Install Playwright browsers
        shell: bash
        run: |
          pnpm -w exec playwright install --with-deps

      - name: Run Playwright smoke tests (@smoke)
        shell: bash
        env:
          CI: true
        run: |
          pnpm -w exec playwright test --grep @smoke --reporter=github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
